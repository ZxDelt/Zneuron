<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zneuron</title>
<link rel="stylesheet" href="css/app.css">
<script src="vendor/dockview/dockview-core.min.js"></script>
<script type="importmap">
  { "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
</script>
</head>
<body>
<header id="topbar">
  <b class="brand">Zneuron</b>
  <span class="stat" title="Brain time, days:hours:minutes:seconds">brain time <b id="t">0:00:00:00</b></span>
  <span class="stat">real speed <b id="realspeed">–</b></span>
  <span class="stat">neurons <b id="nneurons">0</b></span>
  <span class="stat">lines <b id="nlines">0</b></span>
  <span class="stat">awake <b id="nawake">0</b></span>
  <button id="pause">Pause</button>
  <button id="step">Step 1 ms</button>
  <label class="stat">speed <select id="speed"></select> × real time</label>
  <button id="save" title="Save the whole brain (and where the robot is)">Save</button>
  <select id="load" title="Load a saved brain"></select>
  <button id="maximize" title="Full-screen the active panel (F)">⛶ Panel</button>
  <button id="resetLayout" title="Put all panels back where they started">Reset layout</button>
  <span id="conn" class="stat">connecting…</span>
  <span class="stat" title="Graphics card drawing the 3D views">GPU <b id="gpu">–</b></span>
  <span class="hint">space pause · → step · ↑/↓ speed · F full-screen panel · drag tabs to rearrange</span>
</header>
<div id="dock" class="dockview-theme-abyss"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
